<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tobu 3D greybox</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfd8d4;font:15px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:fixed;left:12px;top:10px;color:#fff;text-shadow:0 1px 3px #000;white-space:pre;pointer-events:none;font-weight:600}
#h{font-size:34px}#zone{position:fixed;left:0;right:0;top:38%;text-align:center;color:#fff;font-size:30px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(20,18,16,.72);color:#f4eee0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#ov b{font-size:40px}#help{position:fixed;right:10px;bottom:10px;color:#fff;text-shadow:0 1px 3px #000;text-align:right;pointer-events:none;font-size:12px}
#mread{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;color:#F2E8CC;font-weight:700;font-size:16px;text-shadow:0 0 2px #1E2630,0 0 2px #1E2630,0 1px 3px #1E2630;pointer-events:none;display:none}#mread.warn{color:#C44834}
#hint{position:fixed;left:0;right:0;bottom:14%;text-align:center;color:#fff;font-size:22px;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .8s}</style></head>
<body><div id="hud"><span id="h">0 m</span>
<span id="sub"></span></div><div id="zone"></div><div id="hint">Tap to jump · drag to steer</div>
<div id="ov"><b id="ovT"></b><div id="ovS"></div></div>
<div id="help">Keys: A/D or arrows steer, Space jump/kick · ?bot ?seed=N ?debug</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import {createHero} from './hero.js';
import {createPost,gridMat,perfMat,perfU,gridU,makeSky,LOOK} from './look.js';const CLS={};
const PAL=await (await fetch('./palettes.json')).json(),G=PAL.global,CB=G.climbable; // style D palette (Art, final)
import {createSaves} from './saves.js';
import {createSim,packLog,mul,DT,ZONES as ZN,zoneIdx} from './sim.js';
const Q=new URLSearchParams(location.search),DEBUG=Q.has('debug'),SIM=+Q.get('sim')||0,AUTO=Q.has('bot')||SIM>0,SHOT=Q.get('shot'),MISS=+Q.get('miss')||0;
const VERIFY=Q.get('verify'); // e.g. ?verify=http://localhost:8787 : on death, send the run to the replay check
let BOARD=Q.get('board')||'free',SEED=(+(Q.get('seed')||1))>>>0;
if(VERIFY&&(BOARD==='daily'||BOARD==='weekly')){try{SEED=(await (await fetch(VERIFY+'/seed?board='+BOARD)).json()).seed>>>0;}catch(e){BOARD='free';}} // ranked seeds come from the server
const rD=mul(SEED^0xDEC0); // decor stream: visuals only, never read by sim.js
// camera tuning (visual only; physics tuning lives in sim.js)
const T={camDist:2.3,camHeight:1.05,camPitch:14,camLag:7,camLagY:3.5,fovBase:90,fovMax:100,tightDist:1.55,tightHeight:1.1,tightFov:80,tightRate:2.2,camRollMax:0.2,camRollRate:3.5,camWallOff:0.7};
const hx=c=>parseInt(c.slice(1),16);
const ZONES=['spring','summer','autumn','winter'].map((k,i)=>{const p=PAL[k];return {...ZN[i],key:k,p,sky:hx(p.sky_top),fog:hx(p.fog)};}); // names/heights from sim.js, colours from palettes.json
const zoneAt=h=>ZONES[zoneIdx(Math.max(0,h))];

// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setPixelRatio(Math.min(2,devicePixelRatio));
R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);perfU.minPx.value=Math.max(2,R.domElement.width/180);gridU.px.value=Math.max(0.5,R.domElement.width/1080);const post=createPost(R,PAL); // look reset: shader-lit grid, no environment shadows
const S=new THREE.Scene();const sky=makeSky();S.add(sky);S.fog=new THREE.Fog(LOOK.fog,LOOK.fogNear,LOOK.fogFar);
const cam=new THREE.PerspectiveCamera(T.fovBase,innerWidth/innerHeight,0.1,600);

// ---------- course meshes mirror sim boxes ----------
const meshes=new Map(),cracked=new Set();
// batched course: plain trunks/ledges go into one InstancedMesh per material (unit box scaled per instance); breakables stay
// separate meshes because each carries its own tear uniform. Mirrors sim boxes only.
const UB=new THREE.BoxGeometry(1,1,1),_m4=new THREE.Matrix4(),_q0=new THREE.Quaternion(),_v1=new THREE.Vector3(),_v2=new THREE.Vector3();
const pools=new Map();function pool(mat){let p=pools.get(mat);if(!p){const im=new THREE.InstancedMesh(UB,mat,400);im.count=0;im.frustumCulled=false;S.add(im);p={im,ids:[]};pools.set(mat,p);}return p;}
function poolAdd(b,mat){const p=pool(mat),i=p.im.count++;p.ids[i]=b;_m4.compose(_v1.set(b.x,b.y,b.z),_q0,_v2.set(b.hx*2,b.hy*2,b.hz*2));p.im.setMatrixAt(i,_m4);p.im.instanceMatrix.needsUpdate=true;meshes.set(b.id,{pool:p,b});}
function poolDel(e){const p=e.pool,i=p.ids.indexOf(e.b),l=--p.im.count;if(i<0)return;if(i!==l){p.im.getMatrixAt(l,_m4);p.im.setMatrixAt(i,_m4);p.ids[i]=p.ids[l];}p.ids.length=l;p.im.instanceMatrix.needsUpdate=true;}
function meshFor(b,mat){const m=new THREE.Mesh(UB,mat);m.scale.set(b.hx*2,b.hy*2,b.hz*2);m.position.set(b.x,b.y,b.z);m.userData.b=b;S.add(m);meshes.set(b.id,m);return m;}
const hooks={
 add(b){const zc=zoneAt(b.y);if(b.brk)meshFor(b,climbMat(b,zc));else poolAdd(b,climbMat(b,zc));pendBrk.push([b,zc]);}, // breakable flag may arrive after add (flushed after each tick)
 crack(b){let m=meshes.get(b.id);if(!m)return;if(m.pool){poolDel(m);m=meshFor(b,climbMat(b,zoneAt(b.y)));}if(!m.material.uniforms.tearK){m.material=climbMat(b,zoneAt(b.y));}m.material.uniforms.tearK.value=0;cracked.add(m);if(!AUTO&&navigator.vibrate)navigator.vibrate(25);},
 remove(b){const m=meshes.get(b.id);if(!m)return;if(m.pool)poolDel(m);else{S.remove(m);m.material.dispose();cracked.delete(m);}meshes.delete(b.id);},
 module(m){decor(m.z0,m.z1,m.y0);}};

// climbables stay dark (luma 45-95): bark or ridge rock walls, moss shelf tops, ice in winter
const pendBrk=[];function flushBrk(){for(const [b,zc] of pendBrk){const m=meshes.get(b.id);if(b.brk&&m&&m.pool){poolDel(m);meshFor(b,climbMat(b,zc));}}pendBrk.length=0;}
// look reset placeholders: trunk walls bark-brown, ledge shelves moss, winter ice pale; breakables warm with perforations
const LC={bark:0x516384,moss:0x5476A2,ice:0x858FD1,brk:0xABB8EB}; // BRUSH clipstyle v2: slate climbables, lavender ice, pale lavender breakables (dark perforations)
function climbMat(b,zc){
 if(b.brk)return perfMat(LC.brk,[b.hx,b.hy,b.hz],CB.perforation,CB.breakable_tear);
 if(b.kind==='shelf')return gridMat(zc.key==='winter'?LC.ice:LC.moss);
 return gridMat(LC.bark);}
// ---------- decor (separate seeded stream, no collision) ----------
const deco=[];const VC=gridMat(0xffffff,{vc:1,gA:0.3});const _c=new THREE.Color();
function colored(g,hex){g=g.index?g.toNonIndexed():g;const n=g.attributes.position.count,a=new Float32Array(n*3);_c.setHex(hex);for(let i=0;i<n;i++){a[i*3]=_c.r;a[i*3+1]=_c.g;a[i*3+2]=_c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));g.deleteAttribute('uv');return g;}
function merge(gs){let n=0;for(const g of gs)n+=g.attributes.position.count;const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
 for(const g of gs){P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);C.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;}
 const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P,3));m.setAttribute('normal',new THREE.BufferAttribute(N,3));m.setAttribute('color',new THREE.BufferAttribute(C,3));return m;}
const FC={spring:[0xABB8EB,0x969EDE,0xDBE5FD,0xC7D6EB],summer:[0x969EDE,0x858FD1],autumn:[0xABB8EB,0x858FD1],winter:[0xC7D6EB,0xABB8EB]}; // lavender cedars (clipstyle)
// decor: placeholder forest (cylinder trunks + cone canopies, spring blossom puffs), merged into one draw per module
function decor(z0,z1,y){const zc=zoneAt(y),fc=FC[zc.key],gs=[];
 for(let z=z0;z>z1;z-=6){for(const s of[-1,1]){if(rD()<0.6){const H=18+rD()*22,d=10+rD()*30,r=0.6+rD()*0.5,x=s*d,zz=z-rD()*6,yb=y-12;
   const tr=colored(new THREE.CylinderGeometry(r*0.8,r,H,8),0x858FD1);tr.translate(x,yb+H/2,zz);gs.push(tr);
   const cr=2+rD()*2.5,ch=H*0.55,cn=colored(new THREE.ConeGeometry(cr,ch,8),fc[rD()<0.5?0:1]);cn.translate(x,yb+H-ch*0.35,zz);gs.push(cn);
   if(zc.key==='spring'){const pink=rD()<PAL.spring.blossom_pink_ratio,bl=colored(new THREE.IcosahedronGeometry(1.6+rD()*1.4,1),pink?fc[3]:fc[2]);
    bl.translate(x+(rD()-.5)*2,yb+H*(0.55+rD()*0.35),zz+1.5);gs.push(bl);}}}}
 if(gs.length){const m=new THREE.Mesh(merge(gs),VC);m.position.z=0;m.userData.zEnd=z1;m.userData.zStart=z0;S.add(m);deco.push(m);}
 if(zc.n!=='Spring cedar'&&rD()<0.5){const wf=new THREE.Mesh(new THREE.PlaneGeometry(4+rD()*4,40),new THREE.MeshBasicMaterial({color:hx(G.waterfall.body),transparent:true,opacity:0.85,fog:true}));
  const s=rD()<.5?-1:1;wf.position.set(s*(22+rD()*20),y+4,z1+rD()*(z0-z1));wf.rotation.y=-s*0.6;S.add(wf);deco.push(wf);}
 if(zc.n==='Autumn steam'||rD()<0.15){const st=new THREE.Mesh(new THREE.SphereGeometry(3+rD()*3,8,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.35}));
  st.position.set((rD()<.5?-1:1)*(9+rD()*10),y-3,z1+rD()*(z0-z1));st.userData.steam=1;S.add(st);deco.push(st);}}
const mtns=new THREE.Group();S.add(mtns);{const gs=[];
for(let i=0;i<14;i++){const h=60+rD()*90,g=colored(new THREE.ConeGeometry(h*0.7,h,6),0xC7D6EB);const a=(i/14)*Math.PI*2;g.translate(Math.sin(a)*170,h/2-40,Math.cos(a)*170-60);gs.push(g);}
mtns.add(new THREE.Mesh(merge(gs),VC));}
// drop shadow: crisp dark disc on the highest surface under the climber (reads sim boxes, never writes)
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.5,32),new THREE.MeshBasicMaterial({color:0x1C2438,transparent:true,opacity:0.85,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,fog:false}));shadow.rotation.x=-Math.PI/2;S.add(shadow);
function shadowTick(){let top=-1e9;for(const b of sim.boxes){const t=b.y+b.hy;if(t<=P.pos.y+0.05&&t>top&&Math.abs(P.pos.x-b.x)<=b.hx&&Math.abs(P.pos.z-b.z)<=b.hz)top=t;}
 const h=P.pos.y-top;shadow.visible=top>-1e8&&h<12&&P.state!=='wall';if(!shadow.visible)return;const k=THREE.MathUtils.clamp(1-h/12,0.35,1);shadow.position.set(P.pos.x,top+0.02,P.pos.z);shadow.scale.setScalar(0.75*k+0.25);shadow.material.opacity=0.85*k;} /* hard edge #1C2438 85% (clipstyle) */
// ---------- the run ----------
const sim=createSim({seed:SEED,board:BOARD,adapt:1/* skill-only factor goes here; forced 1 on daily/weekly */,nobrk:Q.has('nobrk'),nomist:Q.has('nomist'),miss:MISS,hooks});
const P=sim.P,mistY=sim.mist,ZT=sim.ZT,mods=sim.mods,modAt=sim.modAt;

// ---------- player: style D grasshopper, contact-driven poses (visual only, hero.js) ----------
const hero=createHero(S,P,sim.boxes);hero.parts.forEach(o=>post.tag(o,CLS.hero)); // hero row is 0 px: its own hull draws it
// mist: drawn by the post pass as a scalloped edge (line over band over body); warning line inside 3 s, off past 3.5 s
const MW=G.mist;let mSp=0,mLast=null,mWarn=false,mWarnA=0;const mRead=document.createElement('div');mRead.id='mread';document.body.appendChild(mRead);
function mistTick(dt){if(mLast!==null)mSp+=((mistY.v-mLast)/dt-mSp)*(1-Math.exp(-dt/0.5));mLast=mistY.v;
 const tt=(P.pos.y-mistY.v)/Math.max(mSp-(P.state==='air'?Math.min(0,P.vel.y):0),0.05); /* closing speed: mist rise plus any fall */ if(!mWarn&&tt<MW.warning_on_s)mWarn=true;else if(mWarn&&tt>MW.warning_off_s)mWarn=false;
 mWarnA=THREE.MathUtils.clamp(mWarnA+(mWarn?1:-1)*dt/MW.warning_fade_s,0,1);}
const _mv=new THREE.Vector3(),_sz=new THREE.Vector2();
function mistDraw(){R.getDrawingBufferSize(_sz);cam.updateMatrixWorld();_mv.set(P.pos.x,mistY.v,Math.min(P.pos.z,cam.position.z-6)).project(cam); /* edge at the hero's depth, never closer than 6 m */const y=(_mv.y*0.5+0.5)*_sz.y,U=post.U;
 U.mistY.value=_mv.z<1?y:-1e4;U.warn.value=mWarnA;U.mistT.value=P.t;
 const off=y<0,d=Math.max(0,P.pos.y-mistY.v);mRead.style.display=off&&P.mode!=='dead'?'block':'none';mRead.textContent='mist '+d.toFixed(0)+' m';mRead.classList.toggle('warn',mWarnA>0.5);}

// ---------- input: auto-run, tap = jump / wall-kick, drag = steer. Applied only at the next fixed tick. ----------
const K={};let steer=0,ptr=null,pending=false;
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Space'){e.preventDefault();press();}});addEventListener('keyup',e=>K[e.code]=0);
addEventListener('pointerdown',e=>{ptr={x:e.clientX,t:performance.now(),moved:false};});
addEventListener('pointermove',e=>{if(!ptr)return;const dx=e.clientX-ptr.x;if(Math.abs(dx)>14)ptr.moved=true;if(ptr.moved)steer=THREE.MathUtils.clamp(dx/110,-1,1);});
addEventListener('pointerup',()=>{if(ptr&&!ptr.moved&&performance.now()-ptr.t<350)press();ptr=null;steer=0;});
function press(){if(P.mode==='dead'){restart();return}pending=true;hideHint();}
// No thanks: end the run where it stands. Nothing is spent; the log simply ends on the Catch screen and the server replays it as declined.
function declineCatch(){if(P.mode!=='catch')return;pending=false;sim.decline();}
window.declineCatch=declineCatch;addEventListener('keydown',e=>{if(e.code==='KeyN')declineCatch();});
let hinted=localStorage.getItem('tobu3d_hint')==='1';const hintEl=document.getElementById('hint');if(hinted||AUTO)hintEl.style.opacity=0;
function hideHint(){if(!hinted&&P.t>4){hinted=true;localStorage.setItem('tobu3d_hint','1');hintEl.style.opacity=0;}}
function restart(){location.reload();}

// ---------- camera: lagged chase from behind & above, FOV kick, roll into walls ----------
const V=(o)=>new THREE.Vector3(o.x,o.y,o.z);
let roll=0,spdK=0,tightK=0;
// chimney framing: how enclosed the climber is (both sides walled within ~2.6 m). Reads sim boxes only, eased in and out.
function tightness(){let L=99,Rr=99;for(const b of sim.boxes){if(b.kind==='shelf'||Math.abs(P.pos.z-b.z)>b.hz+1.5||P.pos.y<b.y-b.hy-1||P.pos.y>b.y+b.hy+2)continue;const dx=b.x-P.pos.x;if(dx>0)Rr=Math.min(Rr,dx-b.hx);else L=Math.min(L,-dx-b.hx);}return THREE.MathUtils.clamp((5.2-(L+Rr))/1.6,0,1);}const wallOff=new THREE.Vector3(),V0=new THREE.Vector3();const camPos=new THREE.Vector3(0,5,20);
function updateCam(dt){const sp=Math.hypot(P.vel.x,P.vel.z);
 wallOff.lerp(P.state==='wall'?V(P.wallN).multiplyScalar(T.camWallOff):V0,1-Math.exp(-4*dt)); /* eased, never snaps (KAMI) */
 tightK+=(tightness()-tightK)*(1-Math.exp(-T.tightRate*dt));const cD=THREE.MathUtils.lerp(T.camDist,T.tightDist,tightK),cH=THREE.MathUtils.lerp(T.camHeight,T.tightHeight,tightK);
 const off=new THREE.Vector3(-P.vel.x*0.04,cH,cD).add(wallOff);
 const want=V(P.pos).add(off);want.y=Math.max(want.y,mistY.v+1.5);const ox=camPos.x,oy=camPos.y;camPos.lerp(want,1-Math.exp(-T.camLag*dt));camPos.y=oy+(want.y-oy)*(1-Math.exp(-T.camLagY*dt)); /* smoothed vertical follow */camPos.x=ox+(want.x-ox)*(1-Math.exp(-16*dt)); /* keep hopper centred */camPos.y=Math.min(camPos.y,P.pos.y+cH+0.6);camPos.y=Math.max(camPos.y,P.pos.y+cH-THREE.MathUtils.lerp(2.5,1.0,tightK));camPos.z=Math.max(Math.min(camPos.z,P.pos.z+cD+2),P.pos.z+cD-2); /* KAMI: hero always in frame, incl. long falls and the death frame; lag stays inside this leash */cam.position.copy(camPos);
 cam.rotation.order='YXZ';cam.rotation.set(-T.camPitch*Math.PI/180,0,0); // Art/KAMI: fixed ~22deg down chase
 const rt=P.state==='wall'?-P.wallSide*T.camRollMax:-P.vel.x*0.006;roll+=(rt-roll)*(1-Math.exp(-T.camRollRate*dt));cam.rotation.z=roll; /* eased bank into wall-runs */ sky.position.copy(cam.position);
 spdK+=((P.state==='wall'?1:THREE.MathUtils.clamp((Math.hypot(sp,P.vel.y)-12.5)/5,0,1))-spdK)*(1-Math.exp(-5*dt));post.U.spd.value=spdK;post.U.sT.value=P.t;
 cam.fov=THREE.MathUtils.lerp(cam.fov,THREE.MathUtils.lerp(T.fovBase,T.tightFov,tightK)+(T.fovMax-T.fovBase)*(1-tightK)*THREE.MathUtils.clamp((Math.hypot(sp,P.vel.y)-10)/8,0,1),1-Math.exp(-4*dt));cam.updateProjectionMatrix();
 mtns.position.set(0,P.pos.y*0.85,P.pos.z);
 deco.forEach(d=>{if(d.userData.steam){d.position.y+=dt*1.5;d.material.opacity=Math.max(0,d.material.opacity-dt*0.02);}});
 for(let i=deco.length-1;i>=0;i--){const d=deco[i],z=d.userData.zEnd??d.position.z;if(z>P.pos.z+90){S.remove(d);d.geometry.dispose();deco.splice(i,1);continue;}d.visible=(d.userData.zStart??d.position.z)>P.pos.z-LOOK.fogFar-10;} /* fully fogged decor skips its draw */
 for(const m of cracked){const b=m.userData.b,dl=b.dl||0.6,k=Math.min(1,(P.t-b.crackAt)/dl);if(m.material.uniforms.tearK)m.material.uniforms.tearK.value=k;m.position.x=b.x+Math.sin(P.t*70)*0.03*k;} /* shake is visual only */}
const _ca=new THREE.Color(),_cb=new THREE.Color();let lastZone='';
const SAVES=createSaves();const EVERY=BOARD!=='free'||Q.has('u13')||localStorage.getItem('tobu_noads')==='1';let catchSrc=null,catchDone=false; // earned saves (§9.8): local only, never in the checked sim; spending waits on Apollo's free-Catch call
function toast(t){const z=document.getElementById('zone');z.textContent=t;z.style.opacity=1;setTimeout(()=>z.style.opacity=0,2200);}
function zoneTint(){const h=P.pos.y,i=zoneIdx(h);const a=ZONES[i],b=ZONES[Math.min(ZONES.length-1,i+1)];
 const t=b===a?0:THREE.MathUtils.clamp((h-(b.h-20))/20,0,1);S.fog.color.setHex(LOOK.fog).lerp(_cb.setHex(b.fog),0.18*t*0); /* single pale-blue fog for the reset */
 if(a.n!==lastZone){if(lastZone&&!AUTO&&SAVES.zone(a.n))toast('+1 save · first time in '+a.n);lastZone=a.n;const z=document.getElementById('zone');z.textContent=a.n;z.style.opacity=1;setTimeout(()=>z.style.opacity=0,1800);}}

const hE=document.getElementById('h'),sE=document.getElementById('sub'),ov=document.getElementById('ov');
let best=+(localStorage.getItem('tobu3d_best')||0),verdict='',sent=false;
function onDeath(){if(sent)return;sent=true;if(BOARD==='daily'&&!AUTO&&SAVES.daily())toast('+1 save · daily run done');const h=Math.round(P.maxH*10)/10;window.__run={log:packLog(sim.log),claim:{height:h}};
 if(VERIFY&&!AUTO){verdict='checking run…';fetch(VERIFY+'/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(window.__run)})
  .then(r=>r.json()).then(j=>verdict=j.ok?`verified ${j.height} m`:`not accepted: ${j.reason}`).catch(()=>verdict='offline: run not submitted');}}
function render(){if(P.caught&&catchSrc&&!catchDone){catchDone=true;if(!AUTO)SAVES.commit(catchSrc,EVERY);}zoneTint();hE.textContent=(P.maxH|0)+' m';sE.textContent=`best ${best|0}  ·  ${lastZone}${BOARD!=='free'?'  ·  '+BOARD:''}${P.caught?'':'  ·  Catch ready'}${BOARD==='free'?'  ·  saves '+SAVES.n+'/3':''}${DEBUG?`\n${P.state} wallT ${P.wallT.toFixed(2)} vy ${P.vel.y.toFixed(1)} mist ${(P.pos.y-mistY.v).toFixed(1)} m below`:''}`;
 if(P.mode==='catch'){if(!catchSrc)catchSrc=SAVES.source(EVERY);ov.style.display='flex';document.getElementById('ovT').textContent='Second chance?';document.getElementById('ovS').textContent=P.t-P.catchAt<0.5?'…':catchSrc==='free'?'Your Catch is free this run · tap to Catch':catchSrc==='save'?'Use a save ('+SAVES.n+'/3) · tap to Catch · or wait to end run':'Watch a short ad (about 30 s) · tap to Catch · or No thanks';}
 else if(P.mode==='dead'){onDeath();ov.style.display='flex';document.getElementById('ovT').textContent=(P.maxH|0)+' m';document.getElementById('ovS').textContent=(verdict?verdict+'\n':'')+'tap to climb again';if(P.maxH>best){best=P.maxH;localStorage.setItem('tobu3d_best',best);}}
 else ov.style.display='none';mistDraw();post.render(S,cam);}

const CLOSE=Q.get('cam')==='close';let closeSide=1;const closePos=new THREE.Vector3(1.5,1.7,-1.7);const _cv=new THREE.Vector3();
function closeCam(dt){closeSide+=((P.state==='wall'?-P.wallSide:closeSide>0?1:-1)-closeSide)*(1-Math.exp(-3*dt));const r=hero.root.position;
 _cv.set(r.x+closeSide*2.1,r.y+0.9,r.z+1.9);closePos.lerp(_cv,1-Math.exp(-10*dt));cam.position.copy(closePos);cam.lookAt(r.x,r.y,r.z-0.2);} // review camera only (?cam=close)
let catchShown=0;function tick(){if(P.mode==='catch'&&!catchShown)catchShown=performance.now();if(!AUTO&&P.mode==='catch'&&performance.now()-catchShown<500)pending=false; /* 0.5 s guard so a climbing tap can't take the Catch */
 const inp=AUTO?sim.botInput():{press:pending,steer:steer||((K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0))};pending=false;sim.tick(inp);flushBrk();updateCam(DT);shadowTick();mistTick(DT);hero.update(DT,R.domElement.width/1080,R.domElement.width,R.domElement.height);if(CLOSE)closeCam(DT);}
if(SIM){let t=0,TR=[],tk=0;for(;t<SIM;t+=DT){tick();if(Q.has('trace')&&tk++%12===0){const m=modAt(P.pos.z);TR.push([t.toFixed(1),P.mode,P.state,P.pos.x.toFixed(1),P.pos.y.toFixed(1),P.pos.z.toFixed(1),P.vel.y.toFixed(1),m?m.type+'@'+m.edge.toFixed(0)+'/'+m.y0.toFixed(1):'-',mistY.v.toFixed(1)].join(' '))}if(P.mode==='dead')break;if(SHOT&&t>=+SHOT)break;}render();if(TR.length){const pre=document.createElement('pre');pre.id='trace';pre.textContent=TR.join('\n');document.body.appendChild(pre);}
 if(Q.has('runlog')&&window.__run){const pre=document.createElement('pre');pre.id='run';pre.textContent=JSON.stringify(window.__run);document.body.appendChild(pre);}
 if(Q.has('dump')){const pre=document.createElement('pre');pre.id='shot';pre.textContent=R.domElement.toDataURL('image/png');document.body.appendChild(pre);}
 document.title="SIM "+JSON.stringify({draws:post.U.draws,tight:+tightK.toFixed(2),fov:+cam.fov.toFixed(0),warn:+mWarnA.toFixed(2),msp:+mSp.toFixed(2),vy:+P.vel.y.toFixed(1),st:P.state,cam:cam.position.toArray().map(v=>+v.toFixed(1)),pz:+P.pos.z.toFixed(1),mode:P.mode,mist:+mistY.v.toFixed(1),py:+P.pos.y.toFixed(1),my:+post.U.mistY.value.toFixed(0),m:+P.maxH.toFixed(1),t:+t.toFixed(1),...P.stats,ZT,zone:lastZone,mods:sim.log.end});}
else{let last=performance.now(),acc=0;(function loop(now){acc+=Math.min(0.1,(now-last)/1000);last=now;while(acc>=DT){tick();acc-=DT;}render();requestAnimationFrame(loop);})(last);}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);perfU.minPx.value=Math.max(2,R.domElement.width/180);gridU.px.value=Math.max(0.5,R.domElement.width/1080);});
</script></body></html>
