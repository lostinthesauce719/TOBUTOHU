<script type="module">
import * as THREE from './vendor/three.module.min.js';
import {createHero} from './hero.js';import {kit,cedarZone,zoneMix} from './clipkit.js';
import {createPost,gridMat,perfMat,perfU,gridU,makeSky,LOOK} from './look.js';const CLS={};
const PAL=await (await fetch('./palettes.json')).json(),G=PAL.global,CB=G.climbable; // style D palette (Art, final)
import {createSaves} from './saves.js';import {createScenery} from './scenery.js';import {createFlashLimiter} from './flash.js';
import {createSim,packLog,mul,DT,ZONES as ZN,zoneIdx,LIGHTNING as LT} from './sim.js';
const Q=new URLSearchParams(location.search),DEBUG=Q.has('debug'),SIM=+Q.get('sim')||0,AUTO=Q.has('bot')||SIM>0,SHOT=Q.get('shot'),MISS=+Q.get('miss')||0;
const VERIFY=Q.get('verify'); // e.g. ?verify=http://localhost:8787 : on death, send the run to the replay check
let BOARD=Q.get('board')||'free',SEED=(+(Q.get('seed')||1))>>>0;
if(VERIFY&&(BOARD==='daily'||BOARD==='weekly')){try{SEED=(await (await fetch(VERIFY+'/seed?board='+BOARD)).json()).seed>>>0;}catch(e){BOARD='free';}} // ranked seeds come from the server
const rD=mul(SEED^0xDEC0); // decor stream: visuals only, never read by sim.js
// camera tuning (visual only; physics tuning lives in sim.js)
const T={camDist:2.3,camHeight:1.05,camPitch:14,camLag:7,camLagY:3.5,fovBase:90,fovMax:100,tightDist:1.55,tightHeight:1.1,tightFov:80,tightRate:2.2,camRollMax:0.2,camRollRate:3.5,camWallOff:0.7};
const hx=c=>parseInt(c.slice(1),16);
const ZONES=['spring','summer','autumn','winter'].map((k,i)=>{const p=PAL[k];return {...ZN[i],key:k,p,sky:hx(p.sky_top),fog:hx(p.fog)};}); // names/heights from sim.js, colours from palettes.json
const zoneAt=h=>ZONES[zoneIdx(Math.max(0,h))];

// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setPixelRatio(Math.min(2,devicePixelRatio));
R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);perfU.minPx.value=Math.max(2,R.domElement.width/180);gridU.px.value=Math.max(0.5,R.domElement.width/1080);const post=createPost(R,PAL); // look reset: shader-lit grid, no environment shadows
const S=new THREE.Scene();const sky=makeSky();S.add(sky);S.fog=new THREE.Fog(LOOK.fog,LOOK.fogNear,LOOK.fogFar);
const cam=new THREE.PerspectiveCamera(T.fovBase,innerWidth/innerHeight,0.1,600);

// ---------- course meshes mirror sim boxes ----------
const meshes=new Map(),cracked=new Set();
// batched course: plain trunks/ledges go into one InstancedMesh per material (unit box scaled per instance); breakables stay
// separate meshes because each carries its own tear uniform. Mirrors sim boxes only.
const UB=new THREE.BoxGeometry(1,1,1),_m4=new THREE.Matrix4(),_q0=new THREE.Quaternion(),_v1=new THREE.Vector3(),_v2=new THREE.Vector3();
const pools=new Map();function pool(mat){let p=pools.get(mat);if(!p){const im=new THREE.InstancedMesh(UB,mat,400);im.count=0;im.frustumCulled=false;S.add(im);p={im,ids:[]};pools.set(mat,p);}return p;}
function poolAdd(b,mat){const p=pool(mat),i=p.im.count++;p.ids[i]=b;_m4.compose(_v1.set(b.x,b.y,b.z),_q0,_v2.set(b.hx*2,b.hy*2,b.hz*2));p.im.setMatrixAt(i,_m4);p.im.instanceMatrix.needsUpdate=true;meshes.set(b.id,{pool:p,b});}
function poolDel(e){const p=e.pool,i=p.ids.indexOf(e.b),l=--p.im.count;if(i<0)return;if(i!==l){p.im.getMatrixAt(l,_m4);p.im.setMatrixAt(i,_m4);p.ids[i]=p.ids[l];}p.ids.length=l;p.im.instanceMatrix.needsUpdate=true;}
function meshFor(b,mat){const m=new THREE.Mesh(UB,mat);m.scale.set(b.hx*2,b.hy*2,b.hz*2);m.position.set(b.x,b.y,b.z);m.userData.b=b;S.add(m);meshes.set(b.id,m);return m;}
const hooks={
 add(b){pendKit.push(b);}, // built when the module closes (brk flags are set by then): merged kit geometry per module // breakable flag may arrive after add (flushed after each tick)
 crack(b){flushKit();let m=meshes.get(b.id);if(!m)return;if(m.pool){poolDel(m);m=meshFor(b,climbMat(b,zoneAt(b.y)));}if(!m.material.uniforms.tearK){m.material=climbMat(b,zoneAt(b.y));}m.material.uniforms.tearK.value=0;cracked.add(m);if(!AUTO&&navigator.vibrate)navigator.vibrate(25);},
 remove(b){const m=meshes.get(b.id);if(!m)return;if(m.kit){if(--m.kit.n<=0){S.remove(m.kit.mesh);m.kit.mesh.geometry.dispose();}}else if(m.pool)poolDel(m);else{S.remove(m);m.material.dispose();cracked.delete(m);}meshes.delete(b.id);},
 module(m){flushKit();decor(m.z0,m.z1,m.y0);}};
// BRUSH clipkit: branch ledges + curved bark walls (visual only; contact faces sit on the flat sim colliders), one merged draw per module
const KM=gridMat(0xffffff,{vc:1}),pendKit=[];
function flushKit(){if(!pendKit.length)return;const gs=[],ent={n:0,mesh:null};
 for(const b of pendKit){if(b.gone)continue;if(b.brk){meshFor(b,climbMat(b,zoneAt(b.y)));continue;}
  gs.push(b.kind==='shelf'?kit.ledge(THREE,b):kit.wall(THREE,b,Math.sign(b.x)||1));ent.n++;meshes.set(b.id,{kit:ent,b});}
 pendKit.length=0;if(!gs.length)return;const g=mergeKit(gs);ent.mesh=new THREE.Mesh(g,KM);ent.mesh.frustumCulled=false;S.add(ent.mesh);}
function mergeKit(gs){let n=0;for(const g of gs)n+=g.attributes.position.count;const o=new THREE.BufferGeometry();for(const a of['position','normal','color']){const arr=new Float32Array(n*3);let k=0;for(const g of gs){arr.set(g.attributes[a].array,k);k+=g.attributes[a].array.length;}o.setAttribute(a,new THREE.BufferAttribute(arr,3));}return o;}

// climbables stay dark (luma 45-95): bark or ridge rock walls, moss shelf tops, ice in winter
const pendBrk=[];function flushBrk(){flushKit();for(const [b,zc] of pendBrk){const m=meshes.get(b.id);if(b.brk&&m&&m.pool){poolDel(m);meshFor(b,climbMat(b,zc));}}pendBrk.length=0;}
// look reset placeholders: trunk walls bark-brown, ledge shelves moss, winter ice pale; breakables warm with perforations
const LC={bark:0x516384,moss:0x5476A2,ice:0x858FD1,brk:0xABB8EB}; // BRUSH clipstyle v2: slate climbables, lavender ice, pale lavender breakables (dark perforations)
function climbMat(b,zc){

// ---------- decor (separate seeded stream, no collision) ----------
const deco=[];const VC=gridMat(0xffffff,{vc:1,gA:0.3});const _c=new THREE.Color();
function colored(g,hex){g=g.index?g.toNonIndexed():g;const n=g.attributes.position.count,a=new Float32Array(n*3);_c.setHex(hex);for(let i=0;i<n;i++){a[i*3]=_c.r;a[i*3+1]=_c.g;a[i*3+2]=_c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));g.deleteAttribute('uv');return g;}
function merge(gs){let n=0;for(const g of gs)n+=g.attributes.position.count;const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
 for(const g of gs){P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);C.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;}
 const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P,3));m.setAttribute('normal',new THREE.BufferAttribute(N,3));m.setAttribute('color',new THREE.BufferAttribute(C,3));return m;}
const FC={spring:[0xABB8EB,0x969EDE,0xDBE5FD,0xC7D6EB],summer:[0x969EDE,0x858FD1],autumn:[0xABB8EB,0x858FD1],winter:[0xC7D6EB,0xABB8EB]}; // lavender cedars (clipstyle)
// decor: placeholder forest (cylinder trunks + cone canopies, spring blossom puffs), merged into one draw per module
function decor(z0,z1,y){const zc=zoneAt(y),fc=FC[zc.key],gs=[];
 const zm=zoneMix(Math.max(0,y)),zk=zm.t>0.5?zm.b:zm.a; /* BRUSH scenery spec: mid cedars 25-70 from the lane, H 60-100, R 3-5, base y-70, gridded */
 for(let z=z0;z>z1;z-=12){for(const s of[-1,1]){if(rD()<0.7){const H=60+rD()*40,R=3+rD()*2,x=s*(25+R*2.6+rD()*(45-R*2.6)),zz=z-rD()*10;
   const cd=cedarZone(THREE,zk,H,R,1+(rD()*1e6|0));cd.translate(x,y-70,zz);gs.push(cd);}}}
 if(rD()<0.3){const s=rD()<.5?-1:1,t=kit.torii(THREE,10,9);t.rotateY(s*0.5);t.translate(s*(28+rD()*10),y-2,z1+rD()*(z0-z1));gs.push(t);} /* torii: background, no collider, pale lavender */
 if(gs.length){const m=new THREE.Mesh(merge(gs),VC);m.position.z=0;m.userData.zEnd=z1;m.userData.zStart=z0;S.add(m);deco.push(m);}
 if(zc.n!=='Spring cedar'&&rD()<0.5){const wf=new THREE.Mesh(new THREE.PlaneGeometry(4+rD()*4,40),new THREE.MeshBasicMaterial({color:hx(G.waterfall.body),transparent:true,opacity:0.85,fog:true}));
  const s=rD()<.5?-1:1;wf.position.set(s*(22+rD()*20),y+4,z1+rD()*(z0-z1));wf.rotation.y=-s*0.6;/* placeholder waterfall replaced by scenery.js (rD still drawn so cedar layout is unchanged) */wf.geometry.dispose();}
 if(zc.n==='Autumn steam'||rD()<0.15){const st=new THREE.Mesh(new THREE.SphereGeometry(3+rD()*3,8,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.35}));
  st.position.set((rD()<.5?-1:1)*(9+rD()*10),y-3,z1+rD()*(z0-z1));st.geometry.dispose();}} /* steam now in scenery.js */
const mtns=new THREE.Group();S.add(mtns);{const gs=[];
for(let i=0;i<14;i++){const h=60+rD()*90,g=colored(new THREE.ConeGeometry(h*0.7,h,6),0xC7D6EB);const a=(i/14)*Math.PI*2;g.translate(Math.sin(a)*170,h/2-40,Math.cos(a)*170-60);gs.push(g);}
/* cone mountains replaced by scenery.js backdrop */}
// drop shadow: crisp dark disc on the highest surface under the climber (reads sim boxes, never writes)
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.5,32),new THREE.MeshBasicMaterial({color:0x1C2438,transparent:true,opacity:0.85,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,fog:false}));shadow.rotation.x=-Math.PI/2;S.add(shadow);
function shadowTick(){let top=-1e9;for(const b of sim.boxes){const t=b.y+b.hy;if(t<=P.pos.y+0.05&&t>top&&Math.abs(P.pos.x-b.x)<=b.hx&&Math.abs(P.pos.z-b.z)<=b.hz)top=t;}
 if(P.state==='wall'&&P.lastWall){const b=P.lastWall,sd=P.wallSide;shadow.visible=true;shadow.position.set(b.x-sd*b.hx-sd*0.02,P.pos.y-0.05,P.pos.z);shadow.rotation.set(0,-sd*Math.PI/2,0);shadow.scale.set(0.8,0.4,1);shadow.material.opacity=0.85;return;} /* wall-run: hard shadow projected onto the wall plane */
 shadow.rotation.set(-Math.PI/2,0,0);const h=P.pos.y-top;shadow.visible=top>-1e8&&h<12;if(!shadow.visible)return;const k=THREE.MathUtils.clamp(1-h/12,0.35,1);shadow.position.set(P.pos.x,top+0.02,P.pos.z);shadow.scale.setScalar(0.75*k+0.25);shadow.material.opacity=0.85*k;} /* hard edge #1C2438 85% (clipstyle) */
// ---------- the run ----------
const sim=createSim({seed:SEED,board:BOARD,adapt:1/* skill-only factor goes here; forced 1 on daily/weekly */,nobrk:Q.has('nobrk'),nomist:Q.has('nomist'),miss:MISS,hooks});
const P=sim.P,mistY=sim.mist,ZT=sim.ZT,mods=sim.mods,modAt=sim.modAt;

// ---------- player: style D grasshopper, contact-driven poses (visual only, hero.js) ----------
const hero=createHero(S,P,sim.boxes);hero.parts.forEach(o=>post.tag(o,CLS.hero)); // hero row is 0 px: its own hull draws it
// mist: drawn by the post pass as a scalloped edge (line over band over body); warning line inside 3 s, off past 3.5 s
const MW=G.mist;let mSp=0,mLast=null,mWarn=false,mWarnA=0;const mRead=document.createElement('div');mRead.id='mread';document.body.appendChild(mRead);
function mistTick(dt){if(mLast!==null)mSp+=((mistY.v-mLast)/dt-mSp)*(1-Math.exp(-dt/0.5));mLast=mistY.v;
 const tt=(P.pos.y-mistY.v)/Math.max(mSp-(P.state==='air'?Math.min(0,P.vel.y):0),0.05); /* closing speed: mist rise plus any fall */ if(!mWarn&&tt<MW.warning_on_s)mWarn=true;else if(mWarn&&tt>MW.warning_off_s)mWarn=false;
 mWarnA=THREE.MathUtils.clamp(mWarnA+(mWarn?1:-1)*dt/MW.warning_fade_s,0,1);}
const _mv=new THREE.Vector3(),_sz=new THREE.Vector2();
function mistDraw(){R.getDrawingBufferSize(_sz);cam.updateMatrixWorld();_mv.set(P.pos.x,mistY.v,Math.min(P.pos.z,cam.position.z-6)).project(cam); /* edge at the hero's depth, never closer than 6 m */const y=(_mv.y*0.5+0.5)*_sz.y,U=post.U;
 U.mistY.value=_mv.z<1?y:-1e4;U.warn.value=mWarnA;U.mistT.value=P.t;
 const off=y<0,d=Math.max(0,P.pos.y-mistY.v);mRead.style.display=off&&P.mode!=='dead'?'block':'none';mRead.textContent='mist '+d.toFixed(0)+' m';mRead.classList.toggle('warn',mWarnA>0.5);}

// ---------- lightning visuals: ring decal (3D) + column edges/bolt/flash (overlay). Visual only: reads sim.strikes. ----------
const RM=Q.has('reducemotion')||matchMedia('(prefers-reduced-motion: reduce)').matches;const FL=createFlashLimiter({reduceMotion:RM});const scen=createScenery(S,SEED,RM); /* BRUSH scenery spec: mountains x3, far cedars, falls, steam, birds = 7 draws */const flashUntil=new Map();
const ringMat=()=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3,uniforms:{R:{value:LT.r},prog:{value:0},ph:{value:1},fade:{value:1},px:{value:1}},
 vertexShader:`varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
 fragmentShader:`uniform float R,prog,ph,fade,px; varying vec2 vP; void main(){ float r=length(vP), fw=fwidth(r)/px; vec4 o=vec4(0.);
  float ang=fract(atan(vP.x,vP.y)/6.2832+1.); /* 0 at 12 o'clock (far side), clockwise */
  if(ph<2.5){ float base=abs(r-R)/fw; float arc=abs(r-(R-4.*px*fw))/fw;
   if(base<1.+2. || (ang<=prog && arc<3.+2.)) o=vec4(0.118,0.149,0.188,1.);
   if(base<1. || (ang<=prog && arc<3.)) o=vec4(0.769,0.282,0.204,1.); }
  else { if(abs(r-R)/fw<2.) o=vec4(0.749,0.847,0.894,fade); }
  if(o.a<0.01) discard; gl_FragColor=o; }`});
const rings=[0,1].map(()=>{const m=new THREE.Mesh(new THREE.CircleGeometry(LT.r+0.15,48),ringMat());m.rotation.x=-Math.PI/2;m.visible=false;S.add(m);return m;});
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_rt=new THREE.Vector3();
function toPx(v,o){v.project(cam);o.x=(v.x*0.5+0.5)*_sz.x;o.y=(v.y*0.5+0.5)*_sz.y;return v.z<1&&v.z>-1;}
function lightDraw(){R.getDrawingBufferSize(_sz);cam.updateMatrixWorld();_rt.setFromMatrixColumn(cam.matrixWorld,0);const U=post.U,pxs=_sz.x/1080;U.edgePx.value=Math.max(4*pxs,2*_sz.x/360);
 for(let i=0;i<2;i++){const k=sim.strikes[i],st=U.cSt.value[i],ring=rings[i];if(!k){st.set(0,0,0,0);ring.visible=false;continue;}
  const a=P.t-k.t0,W=LT.warn,Sd=LT.strike;let ph,prog;if(a<W){ph=1;prog=a/W;}else if(a<W+Sd){ph=2;prog=1;}else{ph=3;prog=1;}

function tightness(){let L=99,Rr=99;for(const b of sim.boxes){if(b.kind==='shelf'||Math.abs(P.pos.z-b.z)>b.hz+1.5||P.pos.y<b.y-b.hy-1||P.pos.y>b.y+b.hy+2)continue;const dx=b.x-P.pos.x;if(dx>0)Rr=Math.min(Rr,dx-b.hx);else L=Math.min(L,-dx-b.hx);}return THREE.MathUtils.clamp((5.2-(L+Rr))/1.6,0,1);}const wallOff=new THREE.Vector3(),V0=new THREE.Vector3();const camPos=new THREE.Vector3(0,5,20);

 wallOff.lerp(P.state==='wall'?V(P.wallN).multiplyScalar(T.camWallOff):V0,1-Math.exp(-4*dt)); /* eased, never snaps (KAMI) */
 tightK+=(tightness()-tightK)*(1-Math.exp(-T.tightRate*dt));const cD=THREE.MathUtils.lerp(T.camDist,T.tightDist,tightK),cH=THREE.MathUtils.lerp(T.camHeight,T.tightHeight,tightK);

 cam.rotation.order='YXZ';cam.rotation.set(-T.camPitch*Math.PI/180,0,0); // Art/KAMI: fixed ~22deg down chase
 const rt=P.state==='wall'?-P.wallSide*T.camRollMax:-P.vel.x*0.006;roll+=(rt-roll)*(1-Math.exp(-T.camRollRate*dt));cam.rotation.z=roll; /* eased bank into wall-runs */ sky.position.copy(cam.position);
 spdK+=((P.state==='wall'?1:THREE.MathUtils.clamp((Math.hypot(sp,P.vel.y)-12.5)/5,0,1))-spdK)*(1-Math.exp(-5*dt));post.U.spd.value=spdK;post.U.sT.value=P.t;
 cam.fov=THREE.MathUtils.lerp(cam.fov,THREE.MathUtils.lerp(T.fovBase,T.tightFov,tightK)+(T.fovMax-T.fovBase)*(1-tightK)*THREE.MathUtils.clamp((Math.hypot(sp,P.vel.y)-10)/8,0,1),1-Math.exp(-4*dt));cam.updateProjectionMatrix();
 mtns.position.set(0,P.pos.y*0.85,P.pos.z);
 deco.forEach(d=>{if(d.userData.steam){d.position.y+=dt*1.5;d.material.opacity=Math.max(0,d.material.opacity-dt*0.02);}});
 for(let i=deco.length-1;i>=0;i--){const d=deco[i],z=d.userData.zEnd??d.position.z;if(z>P.pos.z+90){S.remove(d);d.geometry.dispose();deco.splice(i,1);continue;}d.visible=(d.userData.zStart??d.position.z)>P.pos.z-LOOK.fogFar-10;} /* fully fogged decor skips its draw */
 for(const m of cracked){const b=m.userData.b,dl=b.dl||0.6,k=Math.min(1,(P.t-b.crackAt)/dl);if(m.material.uniforms.tearK)m.material.uniforms.tearK.value=k;m.position.x=b.x+Math.sin(P.t*70)*0.03*k;} /* shake is visual only */}

const SAVES=createSaves();const EVERY=BOARD!=='free'||Q.has('u13')||localStorage.getItem('tobu_noads')==='1';let catchSrc=null,catchDone=false; // earned saves (§9.8): local only, never in the checked sim; spending waits on Apollo's free-Catch call

 if(mode==='catch'){const c=CS[st];$('cSub').textContent=c[0];$('cSub').style.fontSize=(c[0].length<48?34:31)+'px';$('bCatch1').textContent=c[1];$('bCatch2').textContent=c[2];
  const sz=st==='ad'?40:50;$('bCatch1').style.fontSize=$('bNo1').style.fontSize=sz+'px'; // one shared label size per screen (ad screen 40 px)
  const pe=$('pips');if(c[3]&&BOARD==='free'){pe.style.display='flex';pe.innerHTML=pipsHTML(SAVES.n);pe.style.left=(330-(3*parseFloat(getComputedStyle(cbEl).getPropertyValue('--pip')||45)+2*12+pe.querySelector('span').offsetWidth+6)/2)+'px';}else pe.style.display='none';}
 window.__cw={state:st,pip:(()=>{const p=document.querySelector('#pips .p');return p&&$('pips').style.display!=='none'?+p.getBoundingClientRect().width.toFixed(2):0})(),catchBtn:+$('bCatch').getBoundingClientRect().width.toFixed(1),noBtn:+$('bNo').getBoundingClientRect().width.toFixed(1)};}
