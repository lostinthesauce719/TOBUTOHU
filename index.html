<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tobu 3D greybox</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfd8d4;font:15px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:fixed;left:12px;top:10px;color:#fff;text-shadow:0 1px 3px #000;white-space:pre;pointer-events:none;font-weight:600}
#h{font-size:34px}#zone{position:fixed;left:0;right:0;top:38%;text-align:center;color:#fff;font-size:30px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(20,18,16,.72);color:#f4eee0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#ov b{font-size:40px}#help{position:fixed;right:10px;bottom:10px;color:#fff;text-shadow:0 1px 3px #000;text-align:right;pointer-events:none;font-size:12px}
#mread{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;color:#F2E8CC;font-weight:700;font-size:16px;text-shadow:0 0 2px #1E2630,0 0 2px #1E2630,0 1px 3px #1E2630;pointer-events:none;display:none}#mread.warn{color:#C44834}
#hint{position:fixed;left:0;right:0;bottom:14%;text-align:center;color:#fff;font-size:22px;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .8s}</style></head>
<body><div id="hud"><span id="h">0 m</span>
<span id="sub"></span></div><div id="zone"></div><div id="hint">Tap to jump · drag to steer</div>
<div id="ov"><b id="ovT"></b><div id="ovS"></div></div>
<div id="help">Keys: A/D or arrows steer, Space jump/kick · ?bot ?seed=N ?debug</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import {createHero} from './hero.js';
import {createPost,celMat,barkMat,perfMat,perfU,CLS} from './cel.js';
const PAL=await (await fetch('./palettes.json')).json(),G=PAL.global,CB=G.climbable; // style D palette (Art, final)
import {createSim,packLog,mul,DT,ZONES as ZN,zoneIdx} from './sim.js';
const Q=new URLSearchParams(location.search),DEBUG=Q.has('debug'),SIM=+Q.get('sim')||0,AUTO=Q.has('bot')||SIM>0,SHOT=Q.get('shot'),MISS=+Q.get('miss')||0;
const VERIFY=Q.get('verify'); // e.g. ?verify=http://localhost:8787 : on death, send the run to the replay check
let BOARD=Q.get('board')||'free',SEED=(+(Q.get('seed')||1))>>>0;
if(VERIFY&&(BOARD==='daily'||BOARD==='weekly')){try{SEED=(await (await fetch(VERIFY+'/seed?board='+BOARD)).json()).seed>>>0;}catch(e){BOARD='free';}} // ranked seeds come from the server
const rD=mul(SEED^0xDEC0); // decor stream: visuals only, never read by sim.js
// camera tuning (visual only; physics tuning lives in sim.js)
const T={camDist:3.0,camHeight:1.6,camPitch:22,camLag:7,fovBase:50,fovMax:60,camRollMax:0.08,camWallOff:0.6};
const hx=c=>parseInt(c.slice(1),16);
const ZONES=['spring','summer','autumn','winter'].map((k,i)=>{const p=PAL[k];return {...ZN[i],key:k,p,sky:hx(p.sky_top),fog:hx(p.fog)};}); // names/heights from sim.js, colours from palettes.json
const zoneAt=h=>ZONES[zoneIdx(Math.max(0,h))];

// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true}); // MSAA lives in the post passR.setPixelRatio(Math.min(2,devicePixelRatio));
R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);perfU.minPx.value=Math.max(2,R.domElement.width/180);const post=createPost(R,PAL); // unlit cel: no lights, no shadow map
const S=new THREE.Scene();S.background=new THREE.Color(ZONES[0].sky);S.fog=new THREE.Fog(ZONES[0].fog,60,220);
if(innerWidth<innerHeight){T.fovBase=55;T.fovMax=64;} /* portrait: grasshopper ~16% width, lower-middle */ const cam=new THREE.PerspectiveCamera(T.fovBase,innerWidth/innerHeight,0.1,600);

// ---------- course meshes mirror sim boxes ----------
const meshes=new Map(),cracked=new Set();
const hooks={
 add(b){const zc=zoneAt(b.y);const m=new THREE.Mesh(new THREE.BoxGeometry(b.hx*2,b.hy*2,b.hz*2),climbMat(b,zc));
  m.position.set(b.x,b.y,b.z);S.add(m);meshes.set(b.id,m);m.userData.b=b;post.tag(m,CLS.climb);
  pendBrk.push([b,m,zc]);}, // breakable material once the sim has flagged it (flushed after each tick; the shot loop never yields to microtasks)
 crack(b){const m=meshes.get(b.id);if(!m)return;if(!m.material.uniforms.tearK)m.material=climbMat(b,zoneAt(b.y)); /* made before the sim flagged it breakable */m.material.uniforms.tearK.value=0; /* perforation splits into the pale tear */cracked.add(m);if(!AUTO&&navigator.vibrate)navigator.vibrate(25);},
 remove(b){const m=meshes.get(b.id);if(!m)return;S.remove(m);m.geometry.dispose();meshes.delete(b.id);cracked.delete(m);},
 module(m){decor(m.z0,m.z1,m.y0);}};

// climbables stay dark (luma 45-95): bark or ridge rock walls, moss shelf tops, ice in winter
const pendBrk=[];function flushBrk(){for(const [b,m,zc] of pendBrk)if(b.brk&&!m.material.uniforms.tearK)m.material=climbMat(b,zc);pendBrk.length=0;}
function climbMat(b,zc){
 if(b.kind==='shelf'){if(b.brk)return perfMat(CB.breakable_front,CB.breakable_front,CB.breakable_fold,[CB.breakable_lit,CB.breakable_top,CB.breakable_fold],[b.hx,b.hy,b.hz],CB.perforation,CB.breakable_tear);
  if(zc.key==='winter')return celMat(CB.shelf_front,CB.shelf_front,CB.shelf_front,[CB.ice_frost_edge,CB.ice_shelf,CB.ice_shelf]);
  return celMat(CB.shelf_front,CB.shelf_front,CB.shelf_front,[CB.shelf_top_lit,CB.shelf_top,CB.shelf_front]);}
 if(b.brk)return perfMat(CB.breakable_lit,CB.breakable_front,CB.breakable_fold,null,[b.hx,b.hy,b.hz],CB.perforation,CB.breakable_tear);
 rD();return barkMat(CB,(CB.ridge_share?CB.ridge_share[0]+0.02:0.47)); /* bark with 45-50% ridge (Art) */}
// ---------- decor (separate seeded stream, no collision) ----------
const deco=[];const birdG=new THREE.Group();S.add(birdG);
function decor(z0,z1,y){const zc=zoneAt(y);
 for(let z=z0;z>z1;z-=6){for(const s of[-1,1]){if(rD()<0.6){const H=18+rD()*22,d=10+rD()*30,p=zc.p,near=d<24;
   const t=new THREE.Mesh(new THREE.ConeGeometry(2+rD()*2.5,H,7),near?celMat(p.foliage_near_lit,p.foliage_near,p.foliage_near_shade):celMat(p.foliage_mid,p.foliage_mid,p.foliage_far));
   t.position.set(s*d,y-12+H/2,z-rD()*6);S.add(t);deco.push(t);post.tag(t,near?CLS.near:CLS.none);
   if(zc.key==='spring'){const pink=rD()<p.blossom_pink_ratio; // ~60/40 white/pink, from the decor stream only
    const bl=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6+rD()*1.4,0),pink?celMat(p.blossom_pink_lit,p.blossom_pink_lit,p.blossom_pink_shade):celMat(p.blossom_white_lit,p.blossom_white_lit,p.blossom_white_shade));
    bl.position.set(t.position.x+(rD()-.5)*2,y-12+H*(0.55+rD()*0.35),t.position.z+1.5);S.add(bl);deco.push(bl);post.tag(bl,near?CLS.near:CLS.none);}}}}
 if(zc.n!=='Spring cedar'&&rD()<0.5){const wf=new THREE.Mesh(new THREE.PlaneGeometry(4+rD()*4,40),new THREE.MeshBasicMaterial({color:hx(G.waterfall.body),transparent:true,opacity:0.85,fog:true}));
  const s=rD()<.5?-1:1;wf.position.set(s*(22+rD()*20),y+4,z1+rD()*(z0-z1));wf.rotation.y=-s*0.6;S.add(wf);deco.push(wf);}
 if(zc.n==='Autumn steam'||rD()<0.15){const st=new THREE.Mesh(new THREE.SphereGeometry(3+rD()*3,8,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.35}));
  st.position.set((rD()<.5?-1:1)*(9+rD()*10),y-3,z1+rD()*(z0-z1));st.userData.steam=1;S.add(st);deco.push(st);}}
const mtns=new THREE.Group();S.add(mtns);
for(let i=0;i<14;i++){const h=60+rD()*90,c=new THREE.Mesh(new THREE.ConeGeometry(h*0.7,h,6),celMat(G.rock.lit,G.rock.base,G.rock.shade));
 const a=(i/14)*Math.PI*2;c.position.set(Math.sin(a)*170,h/2-40,Math.cos(a)*170-60);mtns.add(c);}
for(let i=0;i<10;i++){const p=PAL.summer,c=new THREE.Mesh(new THREE.SphereGeometry(1,10,6),celMat(p.cloud_lit,p.cloud_lit,p.cloud_shade));
 const a=-0.9+rD()*1.8;c.scale.set(18+rD()*20,5+rD()*4,8);c.position.set(Math.sin(a)*190,40+rD()*60,Math.cos(a)*-190-40);mtns.add(c);} // clouds: far cards, no lines
for(let i=0;i<9;i++){const g=new THREE.Group(),m=new THREE.MeshBasicMaterial({color:hx(G.line.near_scenery)});for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.06,0.25),m);w.position.x=s*0.42;w.userData.s=s;g.add(w);}
 g.userData={ph:rD()*6,r:8+rD()*14,h:6+rD()*10,sp:0.3+rD()*0.4};birdG.add(g);}

// ---------- the run ----------
const sim=createSim({seed:SEED,board:BOARD,adapt:1/* skill-only factor goes here; forced 1 on daily/weekly */,nobrk:Q.has('nobrk'),nomist:Q.has('nomist'),miss:MISS,hooks});
const P=sim.P,mistY=sim.mist,ZT=sim.ZT,mods=sim.mods,modAt=sim.modAt;

// ---------- player: style D grasshopper, contact-driven poses (visual only, hero.js) ----------
const hero=createHero(S,P,sim.boxes);hero.parts.forEach(o=>post.tag(o,CLS.hero)); // hero row is 0 px: its own hull draws it
// mist: drawn by the post pass as a scalloped edge (line over band over body); warning line inside 3 s, off past 3.5 s
const MW=G.mist;let mSp=0,mLast=null,mWarn=false,mWarnA=0;const mRead=document.createElement('div');mRead.id='mread';document.body.appendChild(mRead);
function mistTick(dt){if(mLast!==null)mSp+=((mistY.v-mLast)/dt-mSp)*(1-Math.exp(-dt/0.5));mLast=mistY.v;
 const tt=(P.pos.y-mistY.v)/Math.max(mSp-(P.state==='air'?Math.min(0,P.vel.y):0),0.05); /* closing speed: mist rise plus any fall */ if(!mWarn&&tt<MW.warning_on_s)mWarn=true;else if(mWarn&&tt>MW.warning_off_s)mWarn=false;
 mWarnA=THREE.MathUtils.clamp(mWarnA+(mWarn?1:-1)*dt/MW.warning_fade_s,0,1);}
const _mv=new THREE.Vector3(),_sz=new THREE.Vector2();
function mistDraw(){R.getDrawingBufferSize(_sz);cam.updateMatrixWorld();_mv.set(P.pos.x,mistY.v,Math.min(P.pos.z,cam.position.z-6)).project(cam); /* edge at the hero's depth, never closer than 6 m */const y=(_mv.y*0.5+0.5)*_sz.y,U=post.U;
 U.mistY.value=_mv.z<1?y:-1e4;U.warn.value=mWarnA;U.mistT.value=P.t;
 const off=y<0,d=Math.max(0,P.pos.y-mistY.v);mRead.style.display=off&&P.mode!=='dead'?'block':'none';mRead.textContent='mist '+d.toFixed(0)+' m';mRead.classList.toggle('warn',mWarnA>0.5);}

// ---------- input: auto-run, tap = jump / wall-kick, drag = steer. Applied only at the next fixed tick. ----------
const K={};let steer=0,ptr=null,pending=false;
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Space'){e.preventDefault();press();}});addEventListener('keyup',e=>K[e.code]=0);
addEventListener('pointerdown',e=>{ptr={x:e.clientX,t:performance.now(),moved:false};});
addEventListener('pointermove',e=>{if(!ptr)return;const dx=e.clientX-ptr.x;if(Math.abs(dx)>14)ptr.moved=true;if(ptr.moved)steer=THREE.MathUtils.clamp(dx/110,-1,1);});
addEventListener('pointerup',()=>{if(ptr&&!ptr.moved&&performance.now()-ptr.t<350)press();ptr=null;steer=0;});
function press(){if(P.mode==='dead'){restart();return}pending=true;hideHint();}
let hinted=localStorage.getItem('tobu3d_hint')==='1';const hintEl=document.getElementById('hint');if(hinted||AUTO)hintEl.style.opacity=0;
function hideHint(){if(!hinted&&P.t>4){hinted=true;localStorage.setItem('tobu3d_hint','1');hintEl.style.opacity=0;}}
function restart(){location.reload();}

// ---------- camera: lagged chase from behind & above, FOV kick, roll into walls ----------
const V=(o)=>new THREE.Vector3(o.x,o.y,o.z);
let roll=0;const wallOff=new THREE.Vector3(),V0=new THREE.Vector3();const camPos=new THREE.Vector3(0,5,20);
function updateCam(dt){const sp=Math.hypot(P.vel.x,P.vel.z);
 wallOff.lerp(P.state==='wall'?V(P.wallN).multiplyScalar(T.camWallOff):V0,1-Math.exp(-4*dt)); /* eased, never snaps (KAMI) */
 const off=new THREE.Vector3(-P.vel.x*0.04,T.camHeight,T.camDist).add(wallOff);
 const want=V(P.pos).add(off);want.y=Math.max(want.y,mistY.v+1.5);const ox=camPos.x;camPos.lerp(want,1-Math.exp(-T.camLag*dt));camPos.x=ox+(want.x-ox)*(1-Math.exp(-16*dt)); /* keep hopper centred */camPos.y=Math.min(camPos.y,P.pos.y+T.camHeight+0.6);camPos.y=Math.max(camPos.y,P.pos.y+T.camHeight-2.5);camPos.z=Math.max(Math.min(camPos.z,P.pos.z+T.camDist+2),P.pos.z+T.camDist-2); /* KAMI: hero always in frame, incl. long falls and the death frame; lag stays inside this leash */cam.position.copy(camPos);
 cam.rotation.order='YXZ';cam.rotation.set(-T.camPitch*Math.PI/180,0,0); // Art/KAMI: fixed ~22deg down chase
 const rt=P.state==='wall'?-P.wallSide*T.camRollMax:-P.vel.x*0.006;roll+=(rt-roll)*(1-Math.exp(-6*dt));cam.rotation.z=roll;
 cam.fov=THREE.MathUtils.lerp(cam.fov,T.fovBase+(T.fovMax-T.fovBase)*THREE.MathUtils.clamp((Math.hypot(sp,P.vel.y)-10)/8,0,1),1-Math.exp(-4*dt));cam.updateProjectionMatrix();
 mtns.position.set(0,P.pos.y*0.85,P.pos.z);
 birdG.children.forEach(b=>{const u=b.userData,a=P.t*u.sp+u.ph;b.position.set(Math.sin(a)*u.r,P.pos.y+u.h,P.pos.z-30+Math.cos(a)*u.r);b.rotation.y=a+Math.PI/2;b.children.forEach(w=>w.rotation.z=w.userData.s*Math.sin(P.t*9+u.ph)*0.6);});
 deco.forEach(d=>{if(d.userData.steam){d.position.y+=dt*1.5;d.material.opacity=Math.max(0,d.material.opacity-dt*0.02);}});
 for(let i=deco.length-1;i>=0;i--)if(deco[i].position.z>P.pos.z+90){S.remove(deco[i]);deco.splice(i,1);}
 for(const m of cracked){const b=m.userData.b,dl=b.dl||0.6,k=Math.min(1,(P.t-b.crackAt)/dl);if(m.material.uniforms.tearK)m.material.uniforms.tearK.value=k;m.position.x=b.x+Math.sin(P.t*70)*0.03*k;} /* shake is visual only */}
const _ca=new THREE.Color(),_cb=new THREE.Color();let lastZone='';
function zoneTint(){const h=P.pos.y,i=zoneIdx(h);const a=ZONES[i],b=ZONES[Math.min(ZONES.length-1,i+1)];
 const t=b===a?0:THREE.MathUtils.clamp((h-(b.h-20))/20,0,1);S.background.copy(_ca.setHex(a.sky).lerp(_cb.setHex(b.sky),t));S.fog.color.copy(_ca.setHex(a.fog).lerp(_cb.setHex(b.fog),t));
 if(a.n!==lastZone){lastZone=a.n;const z=document.getElementById('zone');z.textContent=a.n;z.style.opacity=1;setTimeout(()=>z.style.opacity=0,1800);}}

const hE=document.getElementById('h'),sE=document.getElementById('sub'),ov=document.getElementById('ov');
let best=+(localStorage.getItem('tobu3d_best')||0),verdict='',sent=false;
function onDeath(){if(sent)return;sent=true;const h=Math.round(P.maxH*10)/10;window.__run={log:packLog(sim.log),claim:{height:h}};
 if(VERIFY&&!AUTO){verdict='checking run…';fetch(VERIFY+'/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(window.__run)})
  .then(r=>r.json()).then(j=>verdict=j.ok?`verified ${j.height} m`:`not accepted: ${j.reason}`).catch(()=>verdict='offline: run not submitted');}}
function render(){zoneTint();hE.textContent=(P.maxH|0)+' m';sE.textContent=`best ${best|0}  ·  ${lastZone}${BOARD!=='free'?'  ·  '+BOARD:''}${P.caught?'':'  ·  Catch ready'}${DEBUG?`\n${P.state} wallT ${P.wallT.toFixed(2)} vy ${P.vel.y.toFixed(1)} mist ${(P.pos.y-mistY.v).toFixed(1)} m below`:''}`;
 if(P.mode==='catch'){ov.style.display='flex';document.getElementById('ovT').textContent='Second chance';document.getElementById('ovS').textContent=P.t-P.catchAt<0.5?'…':BOARD==='free'?'Tap to Catch (optional ad slot in real build) · or wait to end run':'Tap to Catch (free in ranked) · or wait to end run';}
 else if(P.mode==='dead'){onDeath();ov.style.display='flex';document.getElementById('ovT').textContent=(P.maxH|0)+' m';document.getElementById('ovS').textContent=(verdict?verdict+'\n':'')+'tap to climb again';if(P.maxH>best){best=P.maxH;localStorage.setItem('tobu3d_best',best);}}
 else ov.style.display='none';mistDraw();post.render(S,cam);}

const CLOSE=Q.get('cam')==='close';let closeSide=1;const closePos=new THREE.Vector3(1.5,1.7,-1.7);const _cv=new THREE.Vector3();
function closeCam(dt){closeSide+=((P.state==='wall'?-P.wallSide:closeSide>0?1:-1)-closeSide)*(1-Math.exp(-3*dt));const r=hero.root.position;
 _cv.set(r.x+closeSide*2.1,r.y+0.9,r.z+1.9);closePos.lerp(_cv,1-Math.exp(-10*dt));cam.position.copy(closePos);cam.lookAt(r.x,r.y,r.z-0.2);} // review camera only (?cam=close)
function tick(){const inp=AUTO?sim.botInput():{press:pending,steer:steer||((K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0))};pending=false;sim.tick(inp);flushBrk();updateCam(DT);mistTick(DT);hero.update(DT,R.domElement.width/1080,R.domElement.width,R.domElement.height);if(CLOSE)closeCam(DT);}
if(SIM){let t=0,TR=[],tk=0;for(;t<SIM;t+=DT){tick();if(Q.has('trace')&&tk++%12===0){const m=modAt(P.pos.z);TR.push([t.toFixed(1),P.mode,P.state,P.pos.x.toFixed(1),P.pos.y.toFixed(1),P.pos.z.toFixed(1),P.vel.y.toFixed(1),m?m.type+'@'+m.edge.toFixed(0)+'/'+m.y0.toFixed(1):'-',mistY.v.toFixed(1)].join(' '))}if(P.mode==='dead')break;if(SHOT&&t>=+SHOT)break;}render();if(TR.length){const pre=document.createElement('pre');pre.id='trace';pre.textContent=TR.join('\n');document.body.appendChild(pre);}
 if(Q.has('runlog')&&window.__run){const pre=document.createElement('pre');pre.id='run';pre.textContent=JSON.stringify(window.__run);document.body.appendChild(pre);}
 if(Q.has('dump')){const pre=document.createElement('pre');pre.id='shot';pre.textContent=R.domElement.toDataURL('image/png');document.body.appendChild(pre);}
 document.title="SIM "+JSON.stringify({warn:+mWarnA.toFixed(2),msp:+mSp.toFixed(2),vy:+P.vel.y.toFixed(1),st:P.state,cam:cam.position.toArray().map(v=>+v.toFixed(1)),pz:+P.pos.z.toFixed(1),mode:P.mode,mist:+mistY.v.toFixed(1),py:+P.pos.y.toFixed(1),my:+post.U.mistY.value.toFixed(0),m:+P.maxH.toFixed(1),t:+t.toFixed(1),...P.stats,ZT,zone:lastZone,mods:sim.log.end});}
else{let last=performance.now(),acc=0;(function loop(now){acc+=Math.min(0.1,(now-last)/1000);last=now;while(acc>=DT){tick();acc-=DT;}render();requestAnimationFrame(loop);})(last);}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);perfU.minPx.value=Math.max(2,R.domElement.width/180);});
</script></body></html>
